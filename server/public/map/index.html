<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sail-Racing — Live map</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: rgba(15, 20, 32, 0.9);
    color: #eef2f7;
    border-radius: 10px;
    padding: 10px 14px;
    max-width: 280px;
    font-size: 0.9rem;
  }
  #panel h2 { margin: 0 0 4px; font-size: 1rem; }
  .boat-row { display: flex; gap: 8px; padding: 2px 0; }
  .boat-row > span:first-child { flex: 1; }
  .tracking { font-size: 0.8rem; align-self: center; }
  .tracking.live { color: #2ecc71; }
  .tracking.stale { color: #9aa7b8; }
  .final-lap { color: #ff6b35; font-weight: 700; }
  .finished { color: #2ecc71; }
  .boat-label { background: rgba(15, 20, 32, 0.8); color: #fff; border: none; box-shadow: none; font-size: 11px; }
  .fit-button {
    background: #fff;
    border: 2px solid rgba(0, 0, 0, 0.3);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h2 id="raceName">Loading…</h2>
    <div id="boatList"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
